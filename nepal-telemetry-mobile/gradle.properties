# Trimmed for this machine's tight commit budget (Android Studio + emulator
# running alongside the build). Heavier settings cause the Gradle daemon JVM
# to hit a native-memory OOM (hs_err ... arena.cpp / Chunk::new). See
# nepal-telemetry-project CLAUDE.md build notes.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.configuration-cache=true
