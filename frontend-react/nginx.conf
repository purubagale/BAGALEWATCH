# Preserve an X-Forwarded-Proto set by an upstream proxy (2026-08-23).
#
# This used to be `proxy_set_header X-Forwarded-Proto $scheme` on every
# location. $scheme is NGINX's OWN scheme, which is http, because Traefik
# terminates TLS and forwards plain HTTP to this container. So nginx
# OVERWROTE the `https` Traefik had set with `http`, Django saw an insecure
# request, SECURE_SSL_REDIRECT (on whenever HTTPS_ENABLED=1) answered 301 to
# https, Traefik forwarded that back as http, and the site died in an
# infinite redirect loop. Confirmed on the staging host before it was
# reachable: even with X-Forwarded-Proto: https on the request, nginx
# replaced it and Django returned 301.
#
# SECURE_PROXY_SSL_HEADER in settings.py is the other half of this fix and
# is useless without it — Django can only trust the header it actually
# receives.
#
# `default` keeps whatever the proxy sent; the empty case falls back to
# $scheme so a direct hit with no proxy in front still reports honestly
# rather than claiming https.
map $http_x_forwarded_proto $dtwatch_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip + long-lived caching for the built JS/CSS bundle (2026-08-08,
    # "100 concurrent users" scaling pass). Previously unset -> nginx
    # served every asset uncompressed with no cache headers at all, so
    # EVERY page load by EVERY user re-downloaded the full bundle
    # uncompressed — harmless at a handful of users, real bandwidth/time
    # once ~100 people are hitting this. Safe to cache aggressively
    # because Vite fingerprints every built filename with a content hash
    # (see frontend-react/dist output) — a NEW deploy produces NEW
    # filenames, so a stale cached asset under an old filename is simply
    # never requested again, not served stale. `index.html` itself is
    # deliberately excluded (default nginx behavior, no explicit
    # `Cache-Control` block for it below) since IT is what references the
    # current filenames — caching that would pin everyone to today's
    # build until their browser cache expires.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx's own default (1MB) is what actually produced the "Could not
    # save this session (HTTP 413)" error a real 363,082-sample .trp
    # upload hit (2026-08-14) — nginx rejects an oversized body here
    # before django (proxied below) ever sees the request, so raising
    # Django's DATA_UPLOAD_MAX_MEMORY_SIZE alone would NOT have fixed
    # this. The client now sends large DT sessions in bounded batches
    # (see DtUploadPage.tsx's saveSessionChunked()), so THAT feature
    # never needs anywhere close to this.
    #
    # Raised again 2026-08-20 (20m -> 150m): Backup/Restore uploads its
    # entire .netwatch export as ONE unchunked JSON POST (no batching —
    # see settings.py's DATA_UPLOAD_MAX_MEMORY_SIZE comment for why that's
    # deliberate here). A real restore on a freshly migrated server, with
    # a genuine production-size backup (4,966 sites / 50,592 sectors),
    # hit this literal "HTTP 413" — nginx's own status, generated here
    # before Django ever sees the request, which is exactly what a plain
    # 413 (rather than Django's 400 RequestDataTooBig) points at. Must
    # stay in lockstep with settings.py's own limit — see that comment.
    client_max_body_size 150m;

    location ~* \.(?:js|css|svg|woff2?|png|jpg|jpeg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverse proxy to the django container (2026-08-10, "hide/randomize
    # ports like 8000, 8080, 5180 — only the main program on 5180 should
    # be reachable by IP"). Before this, the React app called django
    # directly on its own published port (VITE_DJANGO_API_URL, baked in
    # at build time — see src/api/client.ts) — which meant django/node-
    # gateway/go-worker all had to have their ports published straight to
    # the host/LAN so browsers could reach them, and (a real latent bug
    # this incidentally fixes) that URL was hardcoded to
    # `http://localhost:8000`, which only ever actually worked for a
    # browser running on the SAME machine as Docker — any other LAN
    # client's "localhost:8000" resolves to THEIR OWN machine, not the
    # server, so multi-user LAN access to the API was already broken
    # before this change for anyone but the Docker host itself.
    #
    # Now every request the browser makes stays on port 5180 (this
    # server) — nginx forwards `/api/`, `/media/`, and `/admin/` to
    # django over the internal Docker network (`django:8000`, the
    # compose service DNS name, not `localhost`) — so docker-compose.yml
    # no longer needs to publish 8000/8090/8070 to the host AT ALL, the
    # same "internal-only, no host port" pattern this file's own db/redis
    # services already use. From the browser's point of view this is
    # still same-origin, so no CORS preflight is even needed for the
    # normal app flow anymore either.
    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dtwatch_forwarded_proto;
    }

    # ^~ opts this prefix out of nginx's regex-location matching (2026-09-01
    # fix) -- without it, the .(?:js|css|svg|...)$ regex location above
    # always wins over a plain prefix location for any matching extension,
    # regardless of source order. An uploaded .png/.jpg/.svg media file was
    # silently being caught by that block instead of reaching Django here,
    # and its try_files  =404 looks in nginx's own SPA build dir, where
    # the file obviously never exists -- a 404 with no proxy attempt at all.
    location ^~ /media/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dtwatch_forwarded_proto;
    }

    # Django admin — session/cookie-based, unlike the JWT-authenticated
    # /api/ traffic above. Proxied too so it stays reachable through the
    # same single front door rather than needing its own exception.
    location /admin/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dtwatch_forwarded_proto;
    }

    # ^~ for the same reason as /media/ above -- this is what was actually
    # breaking Django admin's styling: base.css matched the regex location
    # first, got try_files'd against nginx's own SPA build dir (not
    # Django's staticfiles), and 404'd before ever reaching this block.
    location ^~ /static/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dtwatch_forwarded_proto;
    }

    # SPA fallback — client-side routing (Phase 1+) needs every path to
    # resolve to index.html, not a 404 from nginx. Registered AFTER the
    # /api/, /media/, /admin/ blocks above so those still win for their
    # own prefixes; nginx matches the most specific location block
    # regardless of source order for prefix matches, but keeping this
    # last mirrors the actual precedence and avoids relying on that
    # subtlety being obvious to the next person editing this file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}


