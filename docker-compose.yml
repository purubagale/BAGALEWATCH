# DT-WATCH BTS v2 — full stack, self-hosted via Docker Compose.
#
# ISOLATION GUARANTEE (see docs/RUNBOOK.md for the full explanation):
# every port here is chosen so this entire stack can run on the same
# machine as the untouched v1 system (netwatch_server.py on 8080/8081)
# without a single conflict, and every service gets its own storage —
# nothing here ever opens, mounts, or references bagalewatch.db or any
# other v1 file.
#
# Usage:
#   cp .env.example .env      (and fill in real secrets)
#   docker compose up --build
#
# One .env, at the root, for everything — compose interpolation AND the
# django/node containers' own environment (2026-08-21). The per-service
# backend-django/.env and backend-node/.env are gone. frontend-react/.env
# is the one exception and is OPTIONAL: it's read by Vite at image BUILD
# time (the Dockerfile's `COPY . .`), not by compose at run time, and both
# vars in it are deliberately blank — so skip it unless the built app has
# to call a django/node instance that isn't same-origin.

services:
  db:
    # postgis/postgis, not postgres:16-alpine (2026-08-25, PostGIS adoption).
    # Debian-based (glibc) vs the prior Alpine (musl) image — deliberate,
    # not an oversight: mixing libc families under an EXISTING ./data/pgdata
    # bind mount risks silently corrupting collation-dependent indexes, a
    # known Postgres Alpine<->Debian gotcha. Confirmed via AskUserQuestion:
    # local ./data/pgdata gets wiped and reinitialized fresh on this switch
    # (see docs/RUNBOOK.md's PostGIS entry for the reset steps) rather than
    # dumped/restored, since this is dev data. A staging/prod adoption of
    # this same image needs its own real pg_dump/restore pass — this compose
    # file is shared with the ssw-prod deploy (see RUNBOOK.md), so treat
    # that as a separate, deliberate migration, not something this switch
    # does for you.
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    # Resource limits added across every service in this file (2026-10-02
    # perf audit) -- previously NONE of the 10 services here had any
    # mem/CPU ceiling at all, meaning one runaway container (a large
    # RF-report parse, a stuck query) could exhaust the whole host and
    # starve every sibling container on it. `cpus:` is a ceiling per
    # container, not a reservation -- several containers can each be
    # capped near a host's full core count and still correctly timeshare,
    # Docker's CFS quota handles that; what it CANNOT do is accept a
    # per-container value above the engine's own total allocatable CPUs
    # (confirmed live: a hardcoded "4" here failed outright on this dev
    # machine's Docker Desktop, which is itself configured for only 2
    # CPUs regardless of the host's real core count -- a classic Docker
    # Desktop gotcha, distinct from whatever a production host actually
    # has). Every limit in this file is therefore env-var-driven with a
    # conservative default that works on a minimal 2-CPU/low-RAM box --
    # override via .env (e.g. `DB_CPU_LIMIT=4`) to match a real
    # production host's actual specs; see RUNBOOK.md/SERVER_MIGRATION.md
    # for where that .env lives on a deployed server.
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: "${DB_CPU_LIMIT:-1.5}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dtwatch_db}
      POSTGRES_USER: ${POSTGRES_USER:-dtwatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # `max_connections` raised from Postgres' own default of 100
    # (2026-08-08, "100 concurrent users" scaling pass) — gunicorn's
    # worker count is now computed from the server's CPU count and can
    # hold up to 12 workers' worth of persistent connections open at once
    # (see backend-django/gunicorn.conf.py), plus the Go worker's own
    # pool, plus headroom for an admin's ad-hoc `docker compose exec db
    # psql` session. 200 leaves real margin above what gunicorn can ever
    # actually open (its own hard cap already keeps that under ~15) rather
    # than the two numbers coincidentally colliding under real load.
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    # No `ports:` published to the host (2026-08-08, LAN-migration
    # hardening pass) — nothing outside this compose network needs to
    # reach Postgres directly; django/go-worker already connect via the
    # internal `db` service DNS name, not a published host port. Publishing
    # 5432 here used to mean anyone on the same LAN who portscanned this
    # server could reach raw Postgres with the password from .env — and on
    # Linux, a host firewall (ufw/firewalld) does NOT reliably block this,
    # since Docker manipulates iptables directly and commonly bypasses
    # ufw's own rules (a well-known Docker gotcha, not specific to this
    # app). If you need to inspect the DB from the host for debugging, use
    # `docker compose exec db psql -U dtwatch_user dtwatch_db` instead
    # of a host-side client, or temporarily add back
    # `ports: ["127.0.0.1:5432:5432"]` (loopback-only, never a bare
    # "5432:5432") for the duration of that session.
    volumes:
      # Bind mount under the project folder, not a named volume (2026-08-23,
      # "any volume stored should be in dtwatch folder not inside docker"). A
      # named volume lives in Docker's own storage, so backing it up or moving
      # host means `docker volume export`/`import` or a throwaway container —
      # whereas ./data comes along with the folder the team already copies.
      # Same reasoning the `media` mount below was originally chosen for.
      #
      # OWNERSHIP: postgres:16-alpine runs as uid 999 and initdb chowns this
      # directory on first start WHEN IT IS EMPTY, so leave it empty and let
      # the image claim it. Pre-creating it with the wrong owner is what makes
      # Postgres exit complaining about permissions.
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d is required — without it, pg_isready falls back to libpq's
      # default of "a database named the same as the user"
      # ('dtwatch_user'), which doesn't exist (only 'dtwatch_db' does).
      # That mismatch is harmless (pg_isready still reports ready — it
      # only checks the server accepts connections, not that the query
      # itself succeeds) but it was spamming the container logs with a
      # misleading "FATAL: database "dtwatch_user" does not exist" every
      # interval,
      # which looked like a real bug during Phase 1 verification
      # (2026-07-27) and cost a debugging round-trip to rule out.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtwatch_user} -d ${POSTGRES_DB:-dtwatch_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Lightweight workload (login-lockout counter, SSO one-time codes/
    # transactions, telemetry ingest rate-limit buckets) -- see the `db`
    # service's own comment above for why every service in this file now
    # has a limit, and why these are env-var-driven rather than fixed.
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: "${REDIS_CPU_LIMIT:-0.5}"
    # AOF persistence, in the project folder for the same reason as the
    # Postgres mount above (2026-08-23). This service previously had NO volume
    # at all, so its contents were lost on every restart. Survivable while
    # Redis only held Django's cache, but it now also holds in-flight SSO
    # transactions and one-time login codes — losing those mid-login turns a
    # working sign-in into "that sign-in attempt expired".
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    # No `ports:` published either, same reasoning as `db` above — redis
    # here has no auth configured at all, so publishing 6379 would have
    # meant anyone on the LAN could read/write it with zero credentials.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build: ./backend-django
    # Explicit, project-name-independent tag (2026-08-26) — added so
    # `site-sync` below can reference this exact image without depending
    # on Compose's auto-derived `<project>-django` name, which differs
    # between environments (locally the project name is `bagalewatch-v2`
    # from this folder's name; RUNBOOK.md's staging deploy runs the same
    # compose file from `/data/dtwatch`, which would auto-derive
    # `dtwatch-django` instead — a literal tag here means both
    # environments agree on the same name).
    image: dtwatch-backend-django
    restart: unless-stopped
    # The main compute -- gthread workers sharing CPU via I/O-bound
    # context switches (not one physical core per worker), so this
    # doesn't need literal (workers x threads) cores. Env-var-driven, same
    # reasoning as the `db` service's own comment above -- raise
    # DJANGO_CPU_LIMIT/DJANGO_MEM_LIMIT in .env on a real production host
    # with more than this dev machine's 2 CPUs to give gunicorn's worker
    # pool real headroom.
    mem_limit: ${DJANGO_MEM_LIMIT:-1g}
    cpus: "${DJANGO_CPU_LIMIT:-1.5}"
    env_file:
      # Single root .env for the whole stack (2026-08-21 — "do i need .env in
      # every folder in dt-watch or one in root is okey"). This used to be
      # ./backend-django/.env, with a second one under backend-node/. One
      # file is safe here because no var name means two different things
      # across the two services: `PORT` is read only by the node gateway
      # (backend-node/src/server.js), gunicorn hardcodes `0.0.0.0:8000`
      # (backend-django/gunicorn.conf.py) and ignores it, and django's
      # CORS_ALLOWED_ORIGINS vs node's CORS_ALLOWED_ORIGIN are separate
      # names. Compose already reads this same file for ${...} interpolation,
      # so its COMPOSE_FILE/SHARED_REDIS_PASSWORD lines now also land in the
      # container environment — harmless, nothing reads them there.
      - ./.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Build stamp (2026-08-23), read at runtime and reported on /health/ so
      # the About page can compare it against the frontend bundle. Unset for a
      # local `docker compose up`, which correctly reports `dev`.
      APP_VERSION: ${APP_VERSION:-dev}
      BUILD_TAG: ${BUILD_TAG:-}
      GIT_SHA: ${GIT_SHA:-}
      # Django now uses Redis as its cache backend too (2026-08-08
      # scaling pass — see settings.py's CACHES comment), not just the
      # Node gateway/Go worker. Overrides whatever REDIS_URL a copy-pasted
      # .env might have pointed at localhost.
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # The v1 `../bagalewatch.db` read-only bind mount was REMOVED
      # 2026-08-23 ("remove bagalewatch.db it is old one and dont have any
      # data"). The source file no longer exists on any machine, and a bind
      # mount whose source is missing makes Docker silently create an empty
      # DIRECTORY at that path — so every fresh host grew a stray
      # `bagalewatch.db/` folder next to the project, which then looks like
      # a corrupt database to anyone who finds it.
      #
      # core/management/commands/seed_legacy_data.py and
      # scripts/copy_and_inspect_legacy_db.py are deliberately kept: both
      # take a path argument, so if a v1 database ever needs importing again
      # you can `docker cp` it in or re-add a mount for that one run. There
      # is simply no reason to mount a file that does not exist on every
      # single container start.
      # Uploaded menu icons + branding logo (2026-08-08). MEDIA_ROOT is
      # /app/media inside the container (BASE_DIR/media, WORKDIR /app).
      # Without this, uploads only exist in the django container's
      # writable layer and vanish on the next `docker compose up --build`
      # or `docker compose down` — found live the same day the icon
      # upload feature shipped (uploaded icon 404'd, then the container
      # got rebuilt while debugging and the file was gone). A bind mount
      # to a plain host folder (not a named Docker volume) is deliberate:
      # this whole project already lives as a plain folder the team
      # copies/zips when moving to a new machine (see CLAUDE.md — no
      # build step, no server required for the v1 half of this repo).
      # A named volume would need `docker volume export`/`import` or a
      # manual `docker cp` as a separate migration step and would be easy
      # to forget; a host folder just comes along for free with the rest
      # of the repo. Move backend-django/media/ with the rest of the
      # project when migrating machines and uploads survive automatically.
      - ./data/media:/app/media
    # No `ports:` published (2026-08-10, "hide/randomize ports — only the
    # main program on 5180 should be reachable by IP") — same reasoning
    # `db`/`redis` above already use. The `frontend` container's nginx
    # now proxies /api/, /media/, and /admin/ to this service internally
    # via Docker's own `django:8000` service DNS (see
    # frontend-react/nginx.conf) — no other container or LAN client ever
    # needs to reach this port directly. Debug the same way `db` already
    # recommends: `docker compose exec django ...` / `docker compose logs
    # django`, not a host-side HTTP client.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # No separate maintenance services (2026-10-11). Site sync, telemetry
  # retention, coverage roll-up and audit-log pruning run inside the
  # `django` container (entrypoint.sh starts `manage.py run_maintenance`).
  # RUN_MAINTENANCE=0 in .env turns them off. The unused node-gateway and
  # go-worker placeholders were removed the same day.

  frontend:
    # Removed the `args:` block that used to pass VITE_DJANGO_API_URL/
    # VITE_NODE_GATEWAY_URL here (2026-08-10 port-hiding pass) — it never
    # actually worked in the first place (Dockerfile has no matching
    # `ARG` to receive them, so these silently had zero effect on every
    # build; what actually fed Vite was frontend-react/.env, copied in
    # wholesale by the Dockerfile's `COPY . .`). Both env vars are now
    # blanked in that .env file on purpose — see its own comment — since
    # the app defaults to same-origin requests through nginx's new /api/
    # proxy (nginx.conf) instead of a separate published port.
    build:
      # Widened from ./frontend-react to the repo root (2026-10-01,
      # in-app Documentation page) -- DocumentationPage.tsx imports
      # ../../../docs/*.md?raw at build time (Vite bundles these into its
      # own lazy chunk, no runtime file I/O -- see that file's own header
      # comment for why). A build context scoped to ./frontend-react never
      # transmits docs/ (a sibling directory) to the builder at all, so
      # those imports failed to resolve with the old context -- confirmed
      # by a real build failure, not a guess. The root .dockerignore
      # excludes everything except frontend-react/ and docs/ so this
      # doesn't balloon into sending the whole repo (notably data/, which
      # is 500MB+ of bind-mounted Postgres/Redis/media state) to the
      # builder on every build.
      context: .
      dockerfile: frontend-react/Dockerfile
      # Vite inlines VITE_* at BUILD time, so unlike django's runtime env above
      # these have to be build args. The Dockerfile now declares matching ARGs
      # (2026-08-23) — before that it declared none and every build arg here
      # was silently discarded, which is the bug the comment below records.
      args:
        VITE_APP_VERSION: ${APP_VERSION:-dev}
        VITE_BUILD_TAG: ${BUILD_TAG:-}
        VITE_GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    # Static asset serving + reverse proxy only -- the lightest real
    # workload in this file; see the `db` service's own comment for why
    # every service here now has a limit.
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    cpus: "${FRONTEND_CPU_LIMIT:-0.5}"
    depends_on:
      # node-gateway dropped from here (2026-08-31) — it's now behind the
      # `future` profile so it isn't running to depend on, and the SPA
      # never calls it at runtime anyway (this was startup ordering only).
      - django
    ports:
      - "5180:80"
    # NTC's own Nepal street map (2026-10-29): one ~325 MB file,
    # ./data/maps/nepal.pmtiles, served by nginx at /maps/ (nginx.conf). Not
    # in the image; when the file is missing the web maps use the public
    # OpenStreetMap tiles as before.
    volumes:
      - ./data/maps:/usr/share/nginx/maps:ro

# No top-level `volumes:` block any more (2026-08-23). Every persistent path
# is now a bind mount under ./data/, so it travels with the project folder
# instead of living inside Docker's storage — see the `db` service comment.
# ./data/ is gitignored; create it empty and let each image initialise its own
# subdirectory.
