# DT-WATCH speed-test server (2026-10-26). A plain nginx that answers the
# app's speed test and nothing else: no DT-WATCH code, data or keys live
# here, so it is safe on a public address. Same paths as the DT-WATCH
# server's own frontend-react/nginx.conf.
#
#   GET  /speedtest/empty    204 (ping)
#   GET  /speedtest/garbage  32 MB random file (download)
#   POST /speedtest/upload   body read and dropped (upload)

limit_conn_zone $binary_remote_addr zone=speed:10m;
limit_conn_status 429;

server {
    listen 80;
    # listen 443 ssl;  ssl_certificate /etc/nginx/certs/fullchain.pem;  ssl_certificate_key /etc/nginx/certs/privkey.pem;
    server_name _;
    server_tokens off;
    access_log off;

    # Optional: only NTC subscriber address ranges (fill in, then uncomment).
    # allow 10.0.0.0/8;
    # deny all;

    location ^~ /speedtest/ {
        limit_conn speed 16;
        gzip off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        location = /speedtest/empty {
            return 204;
        }
        location = /speedtest/garbage {
            default_type application/octet-stream;
            alias /usr/share/nginx/speedtest/garbage.bin;
        }
        location = /speedtest/upload {
            client_max_body_size 64m;
            client_body_buffer_size 128k;
            return 200;
        }
        return 404;
    }

    location / {
        return 404;
    }
}
