# Public front door for the phone side of DT-WATCH (2026-10-29).
#
# Runs on a host in NTC's DMZ that the internet can reach. It passes ONLY the
# paths the mobile app uses to the private DT-WATCH server and answers
# everything else with 404, so the web application, its login and the staff
# API are never reachable from outside. See README.md next to this file.
#
# Replace before use:
#   telemetry.ntc.net.np        the public name of this front door
#   /etc/ssl/ntc/...            its certificate and key
#   10.0.0.10:5180              the private DT-WATCH server (its frontend port)

# One shared bucket per client address.
limit_req_zone  $binary_remote_addr zone=tel_api:20m   rate=120r/m;
limit_req_zone  $binary_remote_addr zone=tel_reg:10m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=tel_conn:10m;

upstream dtwatch_private {
    server 10.0.0.10:5180;
    keepalive 32;
}

server {
    listen 80;
    server_name telemetry.ntc.net.np;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name telemetry.ntc.net.np;

    ssl_certificate     /etc/ssl/ntc/telemetry.fullchain.pem;
    ssl_certificate_key /etc/ssl/ntc/telemetry.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Phones send small JSON; larger bodies only where named below.
    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 30s;
    limit_conn tel_conn 20;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # replaced, never appended: a client cannot forge it
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    # ── Phone API ────────────────────────────────────────────────────────
    # A plain prefix (not ^~), so the tighter rules below can win.
    location /api/telemetry/v1/ {
        limit_req zone=tel_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://dtwatch_private;
    }

    # Registration and number proof: few per phone, so a tighter limit.
    location ~ ^/api/telemetry/v1/device/(?:challenge|register|verify-number)/ {
        limit_req zone=tel_reg burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://dtwatch_private;
    }

    # Site photos travel as base64 JPEG inside the signed JSON body.
    location = /api/telemetry/v1/device/site-photos/ {
        client_max_body_size 4m;
        limit_req zone=tel_reg burst=5 nodelay;
        proxy_pass http://dtwatch_private;
    }

    # ── Speed test ───────────────────────────────────────────────────────
    # Better served by a separate test machine (docs/speedtest-server/); if
    # it stays on DT-WATCH, pass it through with its own limits.
    location ^~ /speedtest/ {
        limit_conn tel_conn 16;
        client_max_body_size 64m;
        proxy_request_buffering off;
        proxy_buffering off;
        access_log off;
        proxy_pass http://dtwatch_private;
    }

    # ── Everything else is not here ──────────────────────────────────────
    # The web application, /api/v2/ (staff), /api/external/v1/ (NTC systems),
    # /media/ and /maps/ stay private.
    location / {
        return 404;
    }
}
